<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>短段落与结构测试</title>
  </head>
  <body>
    <article>
      <h1>短段落与结构测试</h1>
      <p>你好。</p>
      <p>这是第二段，也很短。</p>

      <h2>无序列表</h2>
      <ul>
        <li>第一项 <strong>加粗</strong></li>
        <li>第二项</li>
      </ul>

      <h2>有序列表</h2>
      <ol>
        <li>有序一</li>
        <li>有序二</li>
      </ol>

      <h2>代码</h2>
      <pre><code class="language-ts">const x = 1;
console.log(x);</code></pre>

      <h2>引用</h2>
      <blockquote>
        <p>引用的一句话。</p>
      </blockquote>

      <h2>行内标记</h2>
      <p>这一段有 <strong>粗体</strong> 与 <em>斜体</em> 与 <code>行内代码</code> 与 <del>删除</del> 与 <a href="https://example.com/">链接</a>。</p>
      <p><strong><em>粗斜体</em></strong> 单独一段。</p>

      <h2>重复段落</h2>
      <p>重复段落。</p>
      <p>重复段落。</p>
    </article>
  </body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               img-src 'self' data: https:;
               connect-src 'self'
                          https://r.jina.ai
                          https://*.deepseek.com
                          https://*.openai.com
                          https://api.openai.com
                          https://*.together.xyz
                          https://api.together.xyz
                          https://openrouter.ai
                          http://localhost:*
                          http://127.0.0.1:*;
               base-uri 'self';
               form-action 'self';"
    />
    <title>KoBook</title>
    <script>
      // Theme bootstrap. Runs before React mounts so the first paint
      // already has the right background and text colour. Reads the
      // same zustand-persist envelope the store writes — see
      // `src/lib/theme.ts` for the source of truth. The script is
      // intentionally tiny: if anything goes wrong we leave the
      // default `data-theme="night"` attribute already on <html> and
      // `App.tsx` will reconcile on mount.
      //
      // The legacy name map is duplicated from `lib/theme.ts` on
      // purpose: this runs before zustand's `migrate`, so a blob
      // written by an older version would otherwise put a data-theme
      // on <html> that no longer has a rule, and the page would flash
      // the default before React corrected it.
      (function () {
        try {
          var MODES = {
            day: "day",
            night: "night",
            light: "day",
            sepia: "day",
            paper: "day",
            dark: "night",
          };
          var theme = "night";
          var raw = localStorage.getItem("gloss-theme");
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              var stored =
                parsed && parsed.state && (parsed.state.theme || parsed.state.mode);
              if (stored) theme = stored;
            } catch (e) {
              // Corrupt blob: fall through to the default.
            }
          }
          var resolved;
          if (theme === "system") {
            resolved =
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "night"
                : "day";
          } else {
            resolved = MODES[theme] || "night";
          }
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme =
            resolved === "night" ? "dark" : "light";
        } catch (e) {
          // localStorage can throw in privacy modes; the default
          // attribute on <html> keeps the page readable.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

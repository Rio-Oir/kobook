name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `pretypecheck` runs `prisma generate`, so the generated client exists
      # even though `server/src/generated/` is gitignored.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
